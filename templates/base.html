<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c3b2e">
  <title>{% block title %}SmashGo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='site.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('courts') }}" aria-label="SmashGo, danh sách sân">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span></span>
      <span>smash<span class="brand-light">go</span></span>
    </a>
    <span class="topbar-note">HỆ THỐNG ĐẶT SÂN CẦU LÔNG</span>
    {% include "partials/navbar.html" %}
    <span class="live-indicator"><span></span> DỮ LIỆU TRỰC TIẾP</span>
  </header>

  {% block content %}{% endblock %}

  <footer class="footer">
    <span>SMASHGO <span class="footer-dot">·</span> HÀ NỘI</span>
    <span>CHƠI HAY HƠN, ĐẶT SÂN DỄ HƠN</span>
  </footer>
</body>
</html>
