{% extends "base.html" %}

{% block title %}Đăng nhập | SmashGo{% endblock %}

{% block content %}
<main class="auth-shell">
  <section class="auth-card" aria-labelledby="login-title">
    <h1 id="login-title">Đăng nhập</h1>
    <p>Đăng nhập để tiếp tục sử dụng SmashGo.</p>

    {% if error_message %}
    <p class="auth-error" role="alert">{{ error_message }}</p>
    {% endif %}

    <form class="auth-form" method="post" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="next" value="{{ next_url or '' }}">
      <label for="email">
        Email
        <input id="email" name="email" type="email" autocomplete="email" required>
      </label>
      <label for="password">
        Mật khẩu
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Đăng nhập</button>
    </form>

    <p class="auth-switch">
      Chưa có tài khoản?
      <a href="{{ url_for('auth.register', next=next_url) if next_url else url_for('auth.register') }}">Đăng ký</a>
    </p>
  </section>
</main>
{% endblock %}
