<!-- Task #95: Wireframe for public court search, court details and date-based availability. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title description">
  <title id="title">SmashGo court discovery and availability wireframe</title>
  <desc id="description">Court list filters, court details and available or booked time slots.</desc>
  <rect width="1200" height="860" fill="#f4f7f1"/>
  <rect width="1200" height="68" fill="#0c3b2e"/>
  <text x="72" y="43" fill="#ffffff" font-family="Arial, sans-serif" font-size="22" font-weight="700">smashgo</text>
  <text x="900" y="41" fill="#dce5dc" font-family="Arial, sans-serif" font-size="14">Danh sách sân</text>
  <text x="76" y="130" fill="#e8794b" font-family="Arial, sans-serif" font-size="13" font-weight="700">DANH SÁCH ĐỊA ĐIỂM</text>
  <text x="76" y="184" fill="#18382e" font-family="Arial, sans-serif" font-size="40" font-weight="700">Tìm sân. Ra sân thôi.</text>
  <text x="76" y="214" fill="#697970" font-family="Arial, sans-serif" font-size="15">Khám phá sân, xem thông tin và chọn khung giờ phù hợp.</text>

  <rect x="72" y="246" width="1056" height="156" fill="#ffffff" stroke="#dce5dc"/>
  <text x="96" y="276" fill="#638273" font-family="Arial, sans-serif" font-size="12" font-weight="700">TÌM KIẾM</text>
  <text x="96" y="307" fill="#18382e" font-family="Arial, sans-serif" font-size="21" font-weight="700">Tìm sân phù hợp</text>
  <g fill="#697970" font-family="Arial, sans-serif" font-size="12">
    <text x="96" y="337">Khu vực / địa chỉ</text><text x="370" y="337">Ngày chơi</text>
    <text x="585" y="337">Giờ bắt đầu</text><text x="790" y="337">Giờ kết thúc</text>
  </g>
  <g fill="#ffffff" stroke="#dce5dc">
    <rect x="96" y="348" width="248" height="38"/><rect x="370" y="348" width="190" height="38"/>
    <rect x="585" y="348" width="180" height="38"/><rect x="790" y="348" width="180" height="38"/>
  </g>
  <rect x="988" y="348" width="116" height="38" rx="3" fill="#0c3b2e"/>
  <text x="1018" y="372" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Tìm sân</text>

  <rect x="72" y="426" width="1056" height="176" fill="#ffffff" stroke="#dce5dc"/>
  <text x="96" y="459" fill="#638273" font-family="Arial, sans-serif" font-size="12" font-weight="700">01 / COURTS</text>
  <text x="96" y="490" fill="#18382e" font-family="Arial, sans-serif" font-size="21" font-weight="700">Sân quanh bạn</text>
  <line x1="96" y1="512" x2="1104" y2="512" stroke="#dce5dc"/>
  <rect x="98" y="528" width="70" height="54" fill="#e6f4ea"/>
  <text x="184" y="550" fill="#18382e" font-family="Arial, sans-serif" font-size="14" font-weight="700">SmashGo Cầu Giấy 1</text>
  <text x="184" y="572" fill="#276849" font-family="Arial, sans-serif" font-size="12">Chi tiết sân</text>
  <text x="490" y="558" fill="#697970" font-family="Arial, sans-serif" font-size="13">06:00–23:00</text>
  <text x="650" y="558" fill="#18382e" font-family="Arial, sans-serif" font-size="13">90.000đ / giờ</text>
  <text x="850" y="558" fill="#276849" font-family="Arial, sans-serif" font-size="12">Đang nhận đặt</text>
  <text x="990" y="558" fill="#276849" font-family="Arial, sans-serif" font-size="12" font-weight="700">Đặt sân →</text>

  <rect x="72" y="628" width="1056" height="188" fill="#ffffff" stroke="#dce5dc"/>
  <text x="96" y="662" fill="#e8794b" font-family="Arial, sans-serif" font-size="12" font-weight="700">CHI TIẾT SÂN</text>
  <text x="96" y="698" fill="#18382e" font-family="Arial, sans-serif" font-size="24" font-weight="700">SmashGo Cầu Giấy 1</text>
  <text x="96" y="726" fill="#697970" font-family="Arial, sans-serif" font-size="13">Vị trí · Tình trạng · Giá thuê · Giờ mở cửa</text>
  <rect x="96" y="744" width="290" height="50" fill="#e6f4ea"/>
  <text x="118" y="775" fill="#18382e" font-family="Arial, sans-serif" font-size="13" font-weight="700">Ảnh sân</text>
  <text x="440" y="662" fill="#638273" font-family="Arial, sans-serif" font-size="12" font-weight="700">LỊCH SÂN · CHỌN NGÀY</text>
  <g font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <rect x="440" y="680" width="136" height="42" rx="3" fill="#e6f4ea" stroke="#b8d3c0"/><text x="508" y="706" fill="#276849">18:00–19:00 · Đặt</text>
    <rect x="588" y="680" width="136" height="42" rx="3" fill="#fff1ec" stroke="#edc5b8"/><text x="656" y="706" fill="#8d3e27">19:00–20:00 · Đã đặt</text>
    <rect x="736" y="680" width="136" height="42" rx="3" fill="#e6f4ea" stroke="#b8d3c0"/><text x="804" y="706" fill="#276849">20:00–21:00 · Đặt</text>
    <rect x="884" y="680" width="136" height="42" rx="3" fill="#f4f7f1" stroke="#dce5dc"/><text x="952" y="706" fill="#697970">21:00–22:00 · Không đặt</text>
  </g>
  <text x="440" y="760" fill="#697970" font-family="Arial, sans-serif" font-size="12">Chọn khung giờ trống sẽ chuyển sang /book với sân, ngày và giờ đã điền sẵn.</text>
