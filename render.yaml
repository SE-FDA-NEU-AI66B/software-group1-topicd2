# Render Blueprint for SmashGo (issue #126).
# Render reads this file when the service is created from "New > Blueprint".
# Secrets are never written here: SECRET_KEY is generated by Render.
services:
  - type: web
    name: smashgo
    runtime: python
    plan: free
    branch: main
    # Deploy a commit on main only after its GitHub checks (ci.yml) pass.
    autoDeployTrigger: checksPass
    buildCommand: pip install -r requirements.txt
    # SQLite on the free plan is wiped at every deploy or restart, so the
    # schema and the sample data are recreated before the app starts.
    # One worker with threads: SQLite has one writer, and the free plan has 512 MB.
    startCommand: python init_db.py && gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: TZ
        value: Asia/Ho_Chi_Minh
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: instance/smashgo.sqlite3
      - key: SECRET_KEY
        generateValue: true
